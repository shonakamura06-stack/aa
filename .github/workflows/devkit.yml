name: devkit

# Lo que el sandbox no puede hacer, lo hace el CI: navegador del sistema,
# matrices de Node y verificación independiente de los mismos tests.
on:
  push:
    branches: [main, 'arena/**']
    paths: ['devkit/**', 'toolkit/**', '.github/workflows/devkit.yml']
  pull_request:
    paths: ['devkit/**', 'toolkit/**']
  workflow_dispatch:

concurrency:
  group: devkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: devkit/package-lock.json

      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-chrome: true

      - name: Instalar dependencias
        working-directory: devkit
        run: npm ci --no-audit --no-fund

      - name: Tests unitarios y de integración
        working-directory: devkit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FONT_DIR: ${{ github.workspace }}/toolkit/fonts
        run: npm test

      - name: Regenerar tokens y comprobar que no hay deriva
        working-directory: devkit
        run: |
          node bin/tokens.mjs
          git diff --exit-code reference/ || { echo "::error::los tokens cambiaron; ejecuta 'devkit tokens' y commitea"; exit 1; }

      - name: Gate de diseño (la interfaz de referencia debe puntuar 100)
        working-directory: devkit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FONT_DIR: ${{ github.workspace }}/toolkit/fonts
        run: node bin/devkit.mjs check test/fixtures/good.html --min-score 100 --max-errors 0

      - name: Análisis de ejemplo de una interfaz con defectos (no bloquea)
        if: always()
        working-directory: devkit
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          FONT_DIR: ${{ github.workspace }}/toolkit/fonts
        run: |
          node bin/devkit.mjs audit test/fixtures/bad.html --viewport mobile || true
          echo "### Auditoría de la interfaz con defectos" >> $GITHUB_STEP_SUMMARY
          cat "$(ls -t reports/*.md | head -1)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devkit-report-node${{ matrix.node }}
          path: devkit/reports/
          retention-days: 7

  gate:
    name: puerta de calidad
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que no se commitean archivos sobredimensionados
        run: |
          limite=$((3 * 1024 * 1024))
          malos=$(git ls-files -z | xargs -0 -I{} sh -c 'test -f "{}" && s=$(wc -c <"{}") && [ "$s" -gt '"$limite"' ] && echo "{} $s"' || true)
          if [ -n "$malos" ]; then
            echo "::warning::archivos > 3 MB versionados:"
            echo "$malos"
          fi
      - name: Resumen
        run: echo "devkit verificado en CI (tests, tokens sin deriva, gate de diseño)" >> $GITHUB_STEP_SUMMARY
